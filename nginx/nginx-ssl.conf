events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/pdf;

    # HTTP to HTTPS Redirect
    server {
        listen 80;
        server_name www.URL.com URL.com; # Enter your URL here... with and without world wide web! : )

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            auth_basic off;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Reverse Proxy
    server {
        listen 443 ssl;
        server_name www.glycine-ai.com;

        ssl_certificate /etc/letsencrypt/live/www.URL.com/fullchain.pem;  # Enter your URL here...
        ssl_certificate_key /etc/letsencrypt/live/www.URL.com/privkey.pem; # Enter your URL here...

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Global Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Basic Authentication for general access
        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # Reverse Proxy to Gradio Frontend
        location / {
            proxy_pass http://rag:7860;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 900s;
        }

        # Reverse Proxy to Backend API
        location /ask/ {
            proxy_pass http://rag:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Proxy PDF & Static Files for Preview
        location /data/ {
            # Proxy PDF/static file requests to the backend (e.g., FastAPI or Gradio)
            proxy_pass http://rag:7860;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Allow embedding PDFs and handling CORS
            auth_basic off;  # Optional: turn off auth for PDF previews
            add_header Content-Type application/pdf if_not_empty;
            add_header Access-Control-Allow-Origin "*" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Certbot Challenge for SSL Renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            auth_basic off;
        }
    }
}
